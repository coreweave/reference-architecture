base_model: Qwen/Qwen3.8-27B

plugins:
    - axolotl.integrations.cut_cross_entropy.CutCrossEntropyPlugin

strict: false

chat_template: qwen3

seed: 42

datasets:
    - path: "winglian/pirate-ultrachat-10k"
      type: chat_template
      split: train
      eot_tokens:
          - <|im_end|>

sequence_len: 2048
sample_packing: true

load_in_4bit: true
adapter: qlora
lora_r: 64
lora_alpha: 128
lora_target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - down_proj
    - up_proj

gradient_accumulation_steps: 2
micro_batch_size: 1
num_epochs: 2
optimizer: adamw_torch_4bit
lr_scheduler: cosine
learning_rate: 0.0002

bf16: auto
tf32: true

gradient_checkpointing: true
logging_steps: 5
attn_implementation: sdpa

warmup_ratio: 0.1
evals_per_epoch: 4
saves_per_epoch: 1
weight_decay: 0.00

wandb_project: myanello-fc-demo
wandb_entity: coreweave1
wandb_mode: online

val_set_size: 0.05
