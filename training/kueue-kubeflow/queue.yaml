apiVersion: v1
kind: Namespace
metadata:
  name: training
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: h100
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: training
spec:
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: training
  resourceGroups:
    - coveredResources: [cpu, memory, nvidia.com/gpu, rdma/ib]
      flavors:
        - name: h100
          resources:
            - name: cpu
              nominalQuota: "32"
            - name: memory
              nominalQuota: 256Gi
            - name: nvidia.com/gpu
              nominalQuota: "16"
            - name: rdma/ib
              nominalQuota: "2"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: training
  namespace: training
spec:
  clusterQueue: training
