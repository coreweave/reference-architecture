apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: linux-legacy-vm
  namespace: vm-workloads
  labels:
    app.kubernetes.io/name: linux-legacy-vm
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linux-legacy-vm
    spec:
      nodeSelector:
        # Verify this label exists and selects only CPU nodes with usable /dev/kvm.
        node.coreweave.cloud/class: cpu
      domain:
        cpu:
          cores: 2
        resources:
          requests:
            cpu: "2"
            memory: 4Gi
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
              ports:
                - name: app-http
                  port: 8080
                  protocol: TCP
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          persistentVolumeClaim:
            claimName: linux-rootdisk
