apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: kafka-local-topic
  labels:
    strimzi.io/cluster: kafka-local
    app.kubernetes.io/part-of: kafka-local
    kafka.local/profile: five-node
spec:
  partitions: 10
  replicas: 5
  config:
    cleanup.policy: delete
    min.insync.replicas: 3
    retention.ms: 86400000
