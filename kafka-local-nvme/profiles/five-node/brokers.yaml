apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: brokers
  labels:
    strimzi.io/cluster: kafka-local
    app.kubernetes.io/part-of: kafka-local
spec:
  replicas: 5
  roles:
    - broker
  # Strimzi creates one PVC per broker. The kafka-local StorageClass
  # dynamically provisions a stable PVC-named local PV directory beneath
  # /mnt/local/kafka on the node selected for the broker.
  storage:
    type: persistent-claim
    size: 400Gi
    class: kafka-local
    deleteClaim: false
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      cpu: "8"
      memory: 8Gi
  jvmOptions:
    -Xms: 4g
    -Xmx: 4g
  template:
    pod:
      terminationGracePeriodSeconds: 300
      tolerations:
        - key: dedicated
          operator: Equal
          value: kafka
          effect: NoSchedule
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kafka.local/kafka-local
                    operator: In
                    values:
                      - "true"
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  strimzi.io/cluster: kafka-local
                  strimzi.io/broker-role: "true"
