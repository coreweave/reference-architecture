# Read-only helper used by scripts/check-node-capacity.sh.
# This manifest is intentionally excluded from every Kustomization. The script
# creates it temporarily, reads one result per selected Kafka node, and removes
# it through an exit trap.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kafka-local-capacity-check
  labels:
    app.kubernetes.io/name: kafka-local-capacity-check
    kafka.local/component: capacity-check
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka-local-capacity-check
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-local-capacity-check
        kafka.local/component: capacity-check
    spec:
      nodeSelector:
        kafka.local/kafka-local: "true"
      tolerations:
        - key: dedicated
          operator: Equal
          value: kafka
          effect: NoSchedule
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      terminationGracePeriodSeconds: 5
      containers:
        - name: capacity-check
          image: docker.io/library/busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              set -- $(df -Pk /host-mnt-local | awk 'NR == 2 {
                print $2, $3, $4
              }')
              total_kib="$1"
              used_kib="$2"
              available_kib="$3"

              if [ -d /host-mnt-local/kafka ]; then
                kafka_kib="$(
                  du -sk /host-mnt-local/kafka | awk '{ print $1 }'
                )"
              else
                kafka_kib=0
              fi

              printf '%s\n' \
                "KAFKA_LOCAL_CAPACITY node=${NODE_NAME} total_kib=${total_kib} used_kib=${used_kib} available_kib=${available_kib} kafka_kib=${kafka_kib}"
              exec sleep 2147483647
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            # Strimzi local directories are owned by GID 0 with group access.
            # A non-root UID with this group can measure them without writes.
            runAsGroup: 0
            runAsUser: 65534
          volumeMounts:
            - name: host-mnt-local
              mountPath: /host-mnt-local
              readOnly: true
      volumes:
        - name: host-mnt-local
          hostPath:
            path: /mnt/local
            type: Directory
