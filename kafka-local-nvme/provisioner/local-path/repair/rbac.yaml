apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-local-pv-repair
  namespace: kafka
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-local-pv-repair
  namespace: kafka
subjects:
  - kind: ServiceAccount
    name: kafka-local-pv-repair
    namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafka-local-pv-repair
